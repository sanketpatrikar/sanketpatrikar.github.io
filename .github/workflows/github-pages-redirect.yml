name: redirect github pages to production

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/github-pages-redirect.yml"
      - "github-pages-redirect/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages-redirect"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup pages
        uses: actions/configure-pages@v6

      - name: upload redirect
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages-redirect

      - name: deploy redirect
        id: deployment
        uses: actions/deploy-pages@v5
