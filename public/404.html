<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Sanket Patrikar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: Geist;
        font-display: swap;
        font-weight: 100 900;
        src: url("/geist-variable.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0 1.5rem;
        background: #fff;
        color: #2f3340;
        font-family: Geist, system-ui, sans-serif;
      }
      main {
        display: flex;
        min-height: 100vh;
        max-width: 56rem;
        margin: auto;
        flex-direction: column;
        justify-content: center;
      }
      .code {
        margin: 0;
        color: #3b82b6;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.3em;
      }
      .title {
        margin: 0.75rem 0 0;
        color: #171923;
        font-size: clamp(2.25rem, 8vw, 3.75rem);
        letter-spacing: -0.04em;
      }
      .description {
        max-width: 36rem;
        margin: 1rem 0 0;
        color: #666b78;
        font-size: 1.25rem;
        line-height: 1.6;
      }
      a {
        width: max-content;
        margin-top: 2rem;
        color: #3b82b6;
        font-size: 1.125rem;
        text-decoration: none;
      }
      a:hover {
        color: #2c668f;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1 class="title">Page not found</h1>
      <p class="description">The page you are looking for does not exist or may have moved.</p>
      <a href="/">Back home</a>
    </main>
  </body>
</html>
